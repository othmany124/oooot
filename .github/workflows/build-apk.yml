name: Build WA Scanner - stable signed APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate source project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -type f -name 'WA-Ultimate-Scanner-Android-*.zip' | sort -V | tail -n 1)
            test -n "$ZIP"
            mkdir -p "$GITHUB_WORKSPACE/scanner_source"
            unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/scanner_source"
            PROJECT=$(find "$GITHUB_WORKSPACE/scanner_source" -name settings.gradle -type f -print -quit)
            test -n "$PROJECT"
            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          fi
      - name: Restore stable signing key
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.WA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Missing stable signing secrets. See UPDATE_AND_SIGNING_AR.md'
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/wa-scanner.jks"
          chmod 600 "$RUNNER_TEMP/wa-scanner.jks"
          echo "WA_SIGNING_KEYSTORE=$RUNNER_TEMP/wa-scanner.jks" >> "$GITHUB_ENV"
          echo "WA_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WA_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WA_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Android APK
        shell: bash
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Show signing certificate SHA-256
        if: success()
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -print -quit)
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | grep -E 'Verified|SHA-256 digest' || true
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Ultimate-Scanner-v1.2.5-update
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: build.log
          if-no-files-found: ignore
