name: Build WA Ultimate Scanner APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager | head -1)

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'WA-Ultimate-Scanner-Android-*.zip' \
            -print -quit)

          test -n "$ZIP"

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT=$(find extracted \
            -name settings.gradle -type f -print -quit)

          test -n "$PROJECT"

          DIR=$(dirname "$PROJECT")
          test -f "$DIR/app/build.gradle"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Ultimate-Scanner-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: build.log
          if-no-files-found: ignore
