name: Build WA Scanner v1.3.3 Parser Crash Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$MGR"
          yes | "$MGR" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MGR" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Extract current release
        shell: bash
        run: |
          set -euo pipefail
          test -f WA-Ultimate-Scanner-Android-v1.3.3-PARSER-CRASH-FIX.zip
          mkdir -p extracted
          unzip -oq WA-Ultimate-Scanner-Android-v1.3.3-PARSER-CRASH-FIX.zip -d extracted
          PROJECT=$(find extracted -name settings.gradle -type f -print -quit)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
      - name: Build debug preview
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Verify package and signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee "$GITHUB_WORKSPACE/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee "$GITHUB_WORKSPACE/package.txt"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Scanner-v1.3.3-PARSER-CRASH-FIX
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            build.log
            signature.txt
            package.txt
          if-no-files-found: ignore
