name: Build WA Ultimate Scanner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'WA-Ultimate-Scanner-Android-*.zip' \
            -print -quit)

          test -n "$ZIP"

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT=$(find extracted \
            -name settings.gradle -type f -print -quit)

          test -n "$PROJECT"

          PROJECT_DIR=$(dirname "$PROJECT")

          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Ultimate-Scanner-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 30
