name: Build WA Scanner v1.4.5 - Final Classification + Compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Extract v1.4.5 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="WA-Ultimate-Scanner-Android-v1.4.5-FINAL-ENGINE-AUDIT.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          rm -rf extracted && mkdir extracted
          unzip -oq "$ZIP" -d extracted
          SETTINGS=$(find extracted -name settings.gradle -type f -print -quit)
          test -n "$SETTINGS"
          DIR=$(dirname "$SETTINGS")
          test -f "$DIR/app/build.gradle"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Source QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash tests/run_local_checks.sh | tee "$GITHUB_WORKSPACE/local-checks.log"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          env \
            -u WA_SIGNING_KEYSTORE \
            -u WA_SIGNING_STORE_PASSWORD \
            -u WA_SIGNING_KEY_ALIAS \
            -u WA_SIGNING_KEY_PASSWORD \
            gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/signature.log"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:' | tee "$GITHUB_WORKSPACE/package.log"
          grep -q 'com.waultimate.scanner.v145' "$GITHUB_WORKSPACE/package.log"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/WA-Ultimate-Scanner-v1.4.5.apk"
          sha256sum "$GITHUB_WORKSPACE/release/WA-Ultimate-Scanner-v1.4.5.apk" > "$GITHUB_WORKSPACE/release/SHA256.txt"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Ultimate-Scanner-v1.4.5-APK
          path: |
            release/WA-Ultimate-Scanner-v1.4.5.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-v1.4.5-Build-Diagnostics
          path: |
            local-checks.log
            build.log
            signature.log
            package.log
          if-no-files-found: ignore
          retention-days: 30
