name: Build WA Scanner v1.3.7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          MGR=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit)

          test -x "$MGR"

          yes | "$MGR" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$MGR" \
            --sdk_root="$SDK" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Verify v1.3.7 archive
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="WA-Ultimate-Scanner-Android-v1.3.7-PREVIEW-NAVIGATION-FIX.zip"

          test -f "$ZIP"
          unzip -tq "$ZIP"

      - name: Extract project
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="WA-Ultimate-Scanner-Android-v1.3.7-PREVIEW-NAVIGATION-FIX.zip"

          rm -rf "$GITHUB_WORKSPACE/v137"
          mkdir -p "$GITHUB_WORKSPACE/v137"

          unzip -oq "$ZIP" \
            -d "$GITHUB_WORKSPACE/v137"

          SETTINGS=$(find "$GITHUB_WORKSPACE/v137" \
            -type f \
            -name settings.gradle \
            -print -quit)

          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")

          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"

      - name: Source verification
        shell: bash
        run: |
          set -Eeuo pipefail

          find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name ScannerAccessibility.java \
            -print -quit | grep .

          find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name PreviewParser.java \
            -print -quit | grep .

          echo "SOURCE CHECK PASSED"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          env \
            -u WA_SIGNING_KEYSTORE \
            -u WA_SIGNING_STORE_PASSWORD \
            -u WA_SIGNING_KEY_ALIAS \
            -u WA_SIGNING_KEY_PASSWORD \
            gradle \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Locate APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            -print -quit)

          test -n "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK_PATH" \
            | tee "$GITHUB_WORKSPACE/signature.txt"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep '^package:' \
            | tee "$GITHUB_WORKSPACE/package.txt"

      - name: Prepare artifact
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/release/WA-Ultimate-Scanner-v1.3.7.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/WA-Ultimate-Scanner-v1.3.7.apk" \
            > "$GITHUB_WORKSPACE/release/SHA256.txt"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Ultimate-Scanner-v1.3.7-APK
          path: |
            release/WA-Ultimate-Scanner-v1.3.7.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-v1.3.7-Build-Diagnostics
          path: |
            build.log
            signature.txt
            package.txt
          if-no-files-found: ignore
          retention-days: 30
