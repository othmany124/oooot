name: Build WA Scanner - stable signed APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate source project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -type f -name 'WA-Ultimate-Scanner-Android-*.zip' | sort -V | tail -n 1)
            test -n "$ZIP"
            mkdir -p "$GITHUB_WORKSPACE/scanner_source"
            unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/scanner_source"
            PROJECT=$(find "$GITHUB_WORKSPACE/scanner_source" -name settings.gradle -type f -print -quit)
            test -n "$PROJECT"
            echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          fi
      - name: Configure preview application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'INNER'
          from pathlib import Path
          import os

          file = Path(
              os.environ["PROJECT_DIR"]
          ) / "app/build.gradle"

          source = file.read_text()

          target = "        debug {"

          if source.count(target) != 1:
              raise SystemExit(
                  "Unexpected Gradle structure"
              )

          source = source.replace(
              target,
              target + "\n"
              "            applicationIdSuffix "
              "'.preview'",
              1
          )

          file.write_text(source)
          print("Preview package configured")
          INNER

      - name: Build Android APK
        shell: bash
        run: |
          set -eo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Show signing certificate SHA-256
        if: success()
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -print -quit)
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | grep -E 'Verified|SHA-256 digest' || true
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Scanner-v1.2.5-PREVIEW
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: build.log
          if-no-files-found: ignore
