name: Build WA Scanner v1.2.7 Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          test -x "$MANAGER"

          yes | "$MANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$MANAGER" \
            --sdk_root="$SDK" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v1.2.7
        shell: bash
        run: |
          set -euo pipefail

          unzip -oq \
            WA-Ultimate-Scanner-Android-v1.2.7-SELECT-WHATSAPP.zip \
            -d extracted

          PROJECT=$(find extracted \
            -name settings.gradle \
            -type f -print -quit)

          test -n "$PROJECT"

          DIR=$(dirname "$PROJECT")

          test -f "$DIR/app/build.gradle"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Configure independent preview
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle"
          s = p.read_text()

          marker = "        debug {"

          if s.count(marker) != 1:
              raise SystemExit(
                  "Cannot safely configure preview: "
                  "unexpected debug configuration"
              )

          s = s.replace(
              marker,
              marker + "\n"
              "            applicationIdSuffix '.preview'",
              1
          )

          p.write_text(s)
          print("Independent preview configured")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          env \
            -u WA_SIGNING_KEYSTORE \
            -u WA_SIGNING_STORE_PASSWORD \
            -u WA_SIGNING_KEY_ALIAS \
            -u WA_SIGNING_KEY_PASSWORD \
            gradle --no-daemon \
              --stacktrace \
              :app:assembleDebug \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name '*.apk' -print -quit)

          test -n "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK" \
            > "$GITHUB_WORKSPACE/signature-report.txt"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Scanner-v1.2.7-PREVIEW
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            build.log
            signature-report.txt
          if-no-files-found: ignore
