name: Build WA Scanner v1.3.8 - Cross Device Navigation Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" \
            'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Extract and validate current release
        shell: bash
        run: |
          set -euo pipefail
          ZIP="WA-Ultimate-Scanner-Android-v1.3.8-CROSS-DEVICE-NAV-FIX.zip"
          test -f "$ZIP"
          unzip -tq "$ZIP"
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle -type f -print -quit)
          test -n "$PROJECT"
          DIR=$(dirname "$PROJECT")
          test -f "$DIR/app/build.gradle"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Syntax checks, parser tests and 192-link navigation simulation
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/src/main/java/com/waultimate/scanner"
          TESTS="$PROJECT_DIR/tests"
          mkdir -p "$RUNNER_TEMP/wa-test-classes"
          javac -d "$RUNNER_TEMP/wa-test-classes" \
            "$SRC/PreviewParser.java" "$SRC/NavigationPolicy.java" \
            "$SRC/QueuePlanner.java" "$TESTS/PreviewParserTest.java" "$TESTS/ClassificationModelTest.java" \
            "$TESTS/NavigationEngineTest.java" "$TESTS/FullFlowSimulationTest.java" \
            "$TESTS/SyntaxCheck.java"
          java -cp "$RUNNER_TEMP/wa-test-classes" SyntaxCheck "$SRC" \
            | tee "$GITHUB_WORKSPACE/source-syntax.log"
          java -cp "$RUNNER_TEMP/wa-test-classes" com.waultimate.scanner.PreviewParserTest \
            | tee "$GITHUB_WORKSPACE/parser-tests.log"
          java -cp "$RUNNER_TEMP/wa-test-classes" com.waultimate.scanner.ClassificationModelTest \
            | tee "$GITHUB_WORKSPACE/classification-tests.log"
          java -cp "$RUNNER_TEMP/wa-test-classes" com.waultimate.scanner.NavigationEngineTest \
            | tee "$GITHUB_WORKSPACE/navigation-tests.log"
          java -cp "$RUNNER_TEMP/wa-test-classes" com.waultimate.scanner.FullFlowSimulationTest \
            | tee "$GITHUB_WORKSPACE/flow-simulation.log"

      - name: Build Android debug preview APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK signature and preview package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee "$GITHUB_WORKSPACE/signature.log"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep '^package:' | tee "$GITHUB_WORKSPACE/package.log"
          grep -q 'com.waultimate.scanner.class136' "$GITHUB_WORKSPACE/package.log"

      - name: Upload preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Scanner-v1.3.8-CLASSIFICATION-PREVIEW-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Always preserve QA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-v1.3.8-Build-Diagnostics
          path: |
            build.log
            source-syntax.log
            parser-tests.log
            classification-tests.log
            navigation-tests.log
            flow-simulation.log
            signature.log
            package.log
          if-no-files-found: ignore
          retention-days: 30
