name: Build WA Scanner v1.3.6

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate update archive
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="WA-Ultimate-Scanner-Android-v1.3.6-CLASSIFICATION-ENGINE.zip"

          test -f "$ZIP"

          unzip -tq "$ZIP"

          echo "v1.3.6 archive verified."

      - name: Extract Android source
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="WA-Ultimate-Scanner-Android-v1.3.6-CLASSIFICATION-ENGINE.zip"

          rm -rf "$GITHUB_WORKSPACE/v136-source"
          mkdir -p "$GITHUB_WORKSPACE/v136-source"

          unzip -oq "$ZIP" \
            -d "$GITHUB_WORKSPACE/v136-source"

          SETTINGS=$(find "$GITHUB_WORKSPACE/v136-source" \
            -type f \
            -name settings.gradle \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle missing"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Pre-build source audit
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking required sources..."

          find "$PROJECT_DIR/app/src/main" \
            -name 'PreviewParser.java' \
            -print -quit | grep .

          find "$PROJECT_DIR/app/src/main" \
            -name 'ScannerAccessibility.java' \
            -print -quit | grep .

          echo "Source audit passed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          env \
            -u WA_SIGNING_KEYSTORE \
            -u WA_SIGNING_STORE_PASSWORD \
            -u WA_SIGNING_KEY_ALIAS \
            -u WA_SIGNING_KEY_PASSWORD \
            gradle \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Locate APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not produced."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK:"
          ls -lh "$APK"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$APK_PATH" \
            | tee "$GITHUB_WORKSPACE/signature-report.txt"

          "$AAPT" \
            dump badging \
            "$APK_PATH" \
            | grep '^package:' \
            | tee "$GITHUB_WORKSPACE/package-report.txt"

      - name: Prepare release APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/release/WA-Ultimate-Scanner-v1.3.6.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/WA-Ultimate-Scanner-v1.3.6.apk" \
            | tee "$GITHUB_WORKSPACE/release/SHA256.txt"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Ultimate-Scanner-v1.3.6-APK
          path: |
            release/WA-Ultimate-Scanner-v1.3.6.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-v1.3.6-Build-Diagnostics
          path: |
            build.log
            signature-report.txt
            package-report.txt
          if-no-files-found: ignore
          retention-days: 30
