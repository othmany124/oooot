name: Build WA Scanner v1.3.2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          test -x "$MGR"

          yes | "$MGR" --sdk_root="$SDK" \
            --licenses >/dev/null || true

          "$MGR" --sdk_root="$SDK" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Extract v1.3.2
        shell: bash
        run: |
          set -euo pipefail

          ZIP="WA-Ultimate-Scanner-Android-v1.3.2-CRASH-DIAGNOSTICS.zip"

          unzip -tq "$ZIP"

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT=$(find extracted \
            -name settings.gradle -type f -print -quit)

          test -n "$PROJECT"

          DIR=$(dirname "$PROJECT")
          test -f "$DIR/app/build.gradle"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name '*.apk' -print -quit)

          test -n "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK" \
            | tee "$GITHUB_WORKSPACE/signature.txt"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep '^package:' \
            | tee "$GITHUB_WORKSPACE/package.txt"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Scanner-v1.3.2-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: |
            build.log
            signature.txt
            package.txt
          if-no-files-found: ignore
          retention-days: 30
